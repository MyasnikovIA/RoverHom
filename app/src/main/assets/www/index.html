<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>RoverHom Multi-Stream</title>
    <style>
        body { background: #101418; color: #eee; font-family: sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1400px; margin: 0 auto; }
        .top-panel { background: #182028; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        .settings-group { display: flex; gap: 20px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 12px; color: #8aa; margin-bottom: 4px; }
        input { padding: 8px; background: #0e1418; color: #fff; border: 1px solid #234; border-radius: 4px; width: 100px;}
        button { background: #248; color: #fff; padding: 9px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #369; }
        button:disabled { background: #333; cursor: not-allowed; }

        .streams-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .cam-card { background: #182028; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .cam-header { padding: 10px; display: flex; justify-content: space-between; align-items: center; background: #0e1418; border-bottom: 1px solid #234; }
        .cam-title { color: #6cf; font-weight: bold; font-size: 14px; }

        .cam-settings { padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; background: #1a222a; align-items: center; }
        .cam-settings select, .cam-settings input[type=number] { padding: 6px; background: #0e1418; color: #fff; border: 1px solid #234; border-radius: 4px; }
        .cam-settings label { display: flex; align-items: center; gap: 4px; margin: 0; cursor: pointer; }

        .cam-buttons { display: flex; gap: 10px; margin-left: auto; }
        .btn-start { background: #285; padding: 6px 12px; font-size: 12px; }
        .btn-stop { background: #833; padding: 6px 12px; font-size: 12px; }

        .cam-view { background: #000; aspect-ratio: 4/3; position: relative; }
        .cam-view img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .cam-view .offline-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #555; font-size: 16px; text-align: center; width: 90%; }

        .banner {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #833;
            color: #fff;
            padding: 14px 24px;
            border-radius: 8px;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            font-size: 14px;
            max-width: 80%;
            text-align: center;
            line-height: 1.4;
        }
        .banner.show { display: block; }
        .banner.info { background: #285; }
        .banner.warn { background: #985; }
    </style>
</head>
<body>
<div id="banner" class="banner"></div>

<div class="container">
    <div class="top-panel">
        <div class="settings-group">
            <div class="form-group">
                <label>Порт (требует перезагрузки):</label>
                <input type="number" id="port" value="8080">
            </div>
        </div>
    </div>

    <div class="streams-grid" id="grid"></div>
</div>

<script>
    let camerasConfig = [];
    let lastHash = "";

    function showBanner(text, kind) {
        const el = document.getElementById('banner');
        el.textContent = text;
        el.className = 'banner show' + (kind ? ' ' + kind : '');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => { el.className = 'banner'; }, 6000);
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function fetchCameras() {
        try {
            let res = await fetch('/api/cameras', { cache: 'no-store' });
            if (!res.ok) return null;
            return await res.json();
        } catch (e) { return null; }
    }

    async function load() {
        let cfg = await fetchCameras();
        if (!cfg) return;
        document.getElementById('port').value = cfg.port;

        let hash = (cfg.cameras || []).map(c => c.id + "_" + c.active).join(",");
        if (hash !== lastHash) {
            lastHash = hash;
            camerasConfig = cfg.cameras || [];
            renderCameras();
        }
    }

    /**
     * Обновляет сетку: удаляет пропавшие карточки, создаёт новые,
     * ОБНОВЛЯЕТ существующие (это было пропущено).
     */
    function renderCameras() {
        let grid = document.getElementById('grid');
        let existing = Array.from(grid.children);

        // Удаляем карточки, которых больше нет в конфиге
        existing.forEach(el => {
            if (!camerasConfig.find(c => String(c.id) === el.dataset.id)) {
                grid.removeChild(el);
            }
        });

        // Создаём или обновляем карточки
        camerasConfig.forEach(cam => {
            let el = grid.querySelector(`.cam-card[data-id="${cam.id}"]`);
            if (!el) {
                el = createCameraCard(cam);
                el.dataset.id = cam.id;
                grid.appendChild(el);
            } else {
                updateCameraCard(el, cam); // ← ГЛАВНОЕ ИСПРАВЛЕНИЕ
            }
        });
    }

    /**
     * Обновляет состояние существующей карточки без пересоздания DOM.
     * Вызывается из renderCameras, когда камера уже есть на странице.
     */
    function updateCameraCard(card, cam) {
        let btnStart = card.querySelector('.btn-start');
        let btnStop = card.querySelector('.btn-stop');
        let img = card.querySelector('img');
        let offline = card.querySelector('.offline-text');

        btnStart.disabled = cam.active;
        btnStop.disabled = !cam.active;

        if (cam.active) {
            offline.style.display = 'none';
            img.style.display = 'block';
            // Запускаем поток ТОЛЬКО если он ещё не запущен
            if (!img.src || img.src === '' || img.src.endsWith('/')) {
                img.src = '/Cam' + cam.id + '.mjpg?' + Date.now();
            }
        } else {
            img.style.display = 'none';
            offline.style.display = 'block';
            offline.textContent = 'Трансляция выключена';
            img.src = '';
        }
    }

    async function postConfig(camId, isActive, extra) {
        extra = extra || {};
        let res = await fetch('/api/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            cache: 'no-store',
            body: JSON.stringify({
                port: parseInt(document.getElementById('port').value),
                cameras: [{
                    id: camId,
                    width: extra.width || 160,
                    height: extra.height || 120,
                    rotation: extra.rotation || 0,
                    fps: extra.fps || 5,
                    grayscale: extra.grayscale || false,
                    active: isActive
                }]
            })
        });
        return res.json();
    }

    async function waitForCamerasToStop(excludeId, maxWaitMs) {
        const start = Date.now();
        while (Date.now() - start < maxWaitMs) {
            const cfg = await fetchCameras();
            if (cfg) {
                const stillActive = (cfg.cameras || []).filter(
                    c => c.id !== excludeId && c.active);
                if (stillActive.length === 0) return true;
            }
            await sleep(300);
        }
        return false;
    }

    async function tryStartCamera(cam, params) {
        // Попытка 1: обычный старт
        let json;
        try {
            json = await postConfig(cam.id, true, params);
        } catch (e) {
            showBanner('Ошибка сети при запуске камеры ' + cam.id + ': ' + e.message);
            return false;
        }
        if (json && json.ok) {
            lastHash = "";
            await load();
            return true;
        }

        // Попытка 2: эксклюзивный запуск
        let freshCfg = await fetchCameras();
        if (!freshCfg) freshCfg = { cameras: camerasConfig };

        let stoppedOthers = [];
        for (let other of freshCfg.cameras) {
            if (other.id !== cam.id && other.active) {
                try {
                    await postConfig(other.id, false, {
                        width: other.width, height: other.height,
                        rotation: other.rotation, fps: other.fps,
                        grayscale: other.grayscale
                    });
                    stoppedOthers.push(other.id);
                    console.log('Stopped camera ' + other.id);
                } catch (e) {
                    console.error('Не удалось остановить камеру ' + other.id, e);
                }
            }
        }

        if (stoppedOthers.length === 0) {
            showBanner('Не удалось запустить камеру ' + cam.id
                + '. Проверьте питание USB или закройте камеру в другом приложении.');
            lastHash = "";
            await load();
            return false;
        }

        // Ждём, пока сервер подтвердит остановку
        const allStopped = await waitForCamerasToStop(cam.id, 5000);
        console.log('waitForCamerasToStop:', allStopped);

        if (!allStopped) {
            showBanner('Сервер не подтвердил остановку камеры ' + stoppedOthers.join(', ')
                + '. Попробуйте ещё раз.');
            lastHash = "";
            await load();
            return false;
        }

        // Даём Samsung HAL время отпустить камеру
        await sleep(2000);

        for (let retry = 1; retry <= 3; retry++) {
            console.log('Exclusive start retry ' + retry + ' for camera ' + cam.id);
            try {
                let json2 = await postConfig(cam.id, true, params);
                if (json2 && json2.ok) {
                    showBanner(
                        'Камера ' + cam.id + ' запущена. '
                        + 'Одновременная работа двух камер не поддерживается — '
                        + 'трансляция камеры ' + stoppedOthers.join(', ') + ' остановлена.',
                        'info');
                    lastHash = "";
                    await load();
                    return true;
                }
            } catch (e) {
                console.error('Retry ' + retry + ' error:', e);
            }
            await sleep(1500);
        }

        showBanner('Не удалось запустить камеру ' + cam.id
            + ' даже после остановки ' + stoppedOthers.join(', ')
            + '. Снизьте разрешение или перезагрузите приложение.', 'warn');
        lastHash = "";
        await load();
        return false;
    }

    function createCameraCard(cam) {
        let card = document.createElement('div');
        card.className = 'cam-card';

        let header = document.createElement('div');
        header.className = 'cam-header';
        header.innerHTML = '<span class="cam-title">Camera ' + cam.id + '</span>';

        let btns = document.createElement('div');
        btns.className = 'cam-buttons';

        let btnStart = document.createElement('button');
        btnStart.className = 'btn-start';
        btnStart.textContent = '▶ Старт';
        btnStart.disabled = cam.active;

        let btnStop = document.createElement('button');
        btnStop.className = 'btn-stop';
        btnStop.textContent = '■ Стоп';
        btnStop.disabled = !cam.active;

        btns.appendChild(btnStart);
        btns.appendChild(btnStop);
        header.appendChild(btns);
        card.appendChild(header);

        let settings = document.createElement('div');
        settings.className = 'cam-settings';

        let selRes = document.createElement('select');
        ['160x120','320x240','640x480','1280x720'].forEach(r => {
            let opt = document.createElement('option');
            opt.value = r; opt.textContent = r;
            if (r === cam.width + 'x' + cam.height) opt.selected = true;
            selRes.appendChild(opt);
        });

        let selRot = document.createElement('select');
        [0, 90, 180, 270].forEach(r => {
            let opt = document.createElement('option');
            opt.value = r; opt.textContent = r + '°';
            if (r === cam.rotation) opt.selected = true;
            selRot.appendChild(opt);
        });

        let inpFps = document.createElement('input');
        inpFps.type = 'number';
        inpFps.value = cam.fps || 5;
        inpFps.min = 1; inpFps.max = 30;
        inpFps.style.width = '60px';

        let lblGray = document.createElement('label');
        let chkGray = document.createElement('input');
        chkGray.type = 'checkbox';
        chkGray.checked = cam.grayscale;
        lblGray.appendChild(chkGray);
        lblGray.appendChild(document.createTextNode('Ч/Б'));

        settings.appendChild(selRes);
        settings.appendChild(selRot);
        settings.appendChild(inpFps);
        settings.appendChild(lblGray);
        card.appendChild(settings);

        let view = document.createElement('div');
        view.className = 'cam-view';

        let offline = document.createElement('div');
        offline.className = 'offline-text';
        offline.innerHTML = cam.active ? 'Ожидание потока...' : 'Трансляция выключена';

        let img = document.createElement('img');
        if (cam.active) {
            img.style.display = 'block';
            offline.style.display = 'none';
            setTimeout(() => { img.src = '/Cam' + cam.id + '.mjpg?' + Date.now(); }, 500);
            img.onerror = () => {
                img.style.display = 'none';
                offline.style.display = 'block';
                offline.textContent = 'Нет видеопотока';
            };
        }

        view.appendChild(offline);
        view.appendChild(img);
        card.appendChild(view);

        let params = () => ({
            width: parseInt(selRes.value.split('x')[0]),
            height: parseInt(selRes.value.split('x')[1]),
            rotation: parseInt(selRot.value),
            fps: parseInt(inpFps.value),
            grayscale: chkGray.checked
        });

        btnStart.onclick = async () => {
            btnStart.disabled = true;
            try {
                await tryStartCamera(cam, params());
            } finally {
                await load();
            }
        };

        btnStop.onclick = async () => {
            try {
                await postConfig(cam.id, false, params());
                lastHash = "";
                await load();
            } catch (e) {
                showBanner('Ошибка: ' + e.message);
            }
        };

        let onChangeHandler = async () => {
            try {
                let json = await postConfig(cam.id, cam.active, params());
                if (!json.ok && cam.active) {
                    showBanner('Не удалось применить настройки к камере ' + cam.id + '.');
                }
                lastHash = "";
                await load();
            } catch (e) {
                showBanner('Ошибка: ' + e.message);
            }
        };

        selRes.onchange = onChangeHandler;
        selRot.onchange = onChangeHandler;
        inpFps.onchange = onChangeHandler;
        chkGray.onchange = onChangeHandler;

        return card;
    }

    load();
    setInterval(load, 2000);
</script>
</body>
</html>
